name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Files
        working-directory: age_calculator
        run: flutter create --platforms=android .

      - name: Get Dependencies
        working-directory: age_calculator
        run: flutter pub get

      - name: Build APK
        working-directory: age_calculator
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Age-Calculator-APK
          path: age_calculator/build/app/outputs/flutter-apk/app-release.apk
